<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Chess Pieces — KOZI Playground</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family: Inter, -apple-system, "SF Pro Text", "Segoe UI", sans-serif;
    background: radial-gradient(120% 90% at 50% 42%, #12121b 0%, #0b0b11 62%, #08080d 100%);
    color:#e8e8ee; overflow:hidden;
  }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #brand {
    position:absolute; top:20px; left:24px; z-index:2;
    font-size:13px; font-weight:700; letter-spacing:.01em; color:#e8e8ee;
    text-decoration:none;
  }
  #brand span { color:#6d6d7a; font-weight:400; }
  #hint {
    position:absolute; top:22px; right:24px; z-index:2;
    font-size:11px; color:#6d6d7a;
  }

  #bar {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%); z-index:2;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center;
    max-width:96vw; padding:8px 10px;
    background:rgba(18,18,26,.78); border:1px solid rgba(255,255,255,.08);
    border-radius:16px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  }
  #bar .sep { width:1px; height:20px; background:rgba(255,255,255,.1); margin:0 4px; }
  #bar button {
    border:0; background:transparent; color:#9a9aa6; font:inherit; font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:10px; cursor:pointer; white-space:nowrap;
  }
  #bar button:hover { color:#e8e8ee; }
  #bar button.active { background:#f1f1f5; color:#141419; }
  #bar button.toggled { background:rgba(84,96,242,.22); color:#aeb6ff; }
  #bar label { font-size:11px; color:#6d6d7a; display:flex; align-items:center; gap:7px; padding:0 4px; }
  #bar input[type=range] { width:88px; accent-color:#5460f2; }
  #dl { border:1px solid rgba(255,255,255,.14) !important; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<a id="brand" href="../">KOZI <span>— 3D Chess Pieces</span></a>
<div id="hint">drag to orbit · scroll to zoom</div>
<div id="bar">
  <button data-piece="all" class="active">All</button>
  <button data-piece="pawn">♙ Pawn</button>
  <button data-piece="rook">♖ Rook</button>
  <button data-piece="knight">♘ Knight</button>
  <button data-piece="bishop">♗ Bishop</button>
  <button data-piece="queen">♕ Queen</button>
  <button data-piece="king">♔ King</button>
  <div class="sep"></div>
  <button data-set="white" class="active">White</button>
  <button data-set="black">Black</button>
  <div class="sep"></div>
  <button id="spin" class="toggled">Spin</button>
  <label>Depth <input id="depth" type="range" min="16" max="110" step="2" value="44"></label>
  <div class="sep"></div>
  <button id="dl">↓ GLB</button>
</div>

<script src="pieces-data.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { SVGLoader } from 'three/addons/loaders/SVGLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';

const ORDER = window.CHESS_ORDER;
const BEVEL_T = 8, BEVEL_S = 10;     // caps keep the exact SVG contour; sides bulge ~stroke width
const RIDGE_R = 5.5;                 // outline ridge radius, ~half the SVG stroke width (10.025)
const RIDGE_FLATTEN = 0.65;          // elliptical cross-section: wider than tall
const RIDGE_SINK = 1.0;              // how deep the ridge sits into the cap surface
const SPACING = 300;
const COLORS = {
  white: { body: 0xf7f6fb },
  black: { body: 0x494952 }
};
const state = { piece: 'all', set: 'white', depth: 44, spin: true };

// ---------- renderer / scene ----------
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(34, 1, 1, 20000);
camera.position.set(0, 320, 1750);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 150, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.55;
controls.minDistance = 260;
controls.maxDistance = 4000;

const hemi = new THREE.HemisphereLight(0xc8ccdd, 0x35353f, 0.55);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(650, 950, 700);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -1400; sun.shadow.camera.right = 1400;
sun.shadow.camera.top = 1400; sun.shadow.camera.bottom = -1400;
sun.shadow.camera.far = 4000;
sun.shadow.bias = -0.0004;
scene.add(sun);

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(5000).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.3 })
);
ground.receiveShadow = true;
scene.add(ground);

// ---------- material (shared, recolored on set switch) ----------
const bodyMat = new THREE.MeshPhysicalMaterial({
  color: COLORS.white.body, roughness: 0.38, metalness: 0,
  clearcoat: 0.5, clearcoatRoughness: 0.25
});

// ---------- SVG -> parts ----------
// Each piece is a list of parts drawn in document order: a fill path, usually
// followed by its outline path (same d, or a slightly larger d on the bases).
// The outline path defines the extruded contour and doubles as the centerline
// of an embossed ridge on the caps; open stroke paths (knight's muzzle line)
// become ridges on the previous part.
const loader = new SVGLoader();

function parsePiece(name) {
  const dom = new DOMParser().parseFromString(window.CHESS_SVG[name], 'image/svg+xml');
  const nodes = [...dom.querySelectorAll('path')];
  const wrapped = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 334 334">'
    + '<g transform="translate(0,334) scale(1,-1)">' + nodes.map(n => n.outerHTML).join('') + '</g></svg>';
  const { paths } = loader.parse(wrapped);   // y-up, index-aligned with nodes

  const parts = [];
  let last = null;
  nodes.forEach((node, i) => {
    const fill = node.getAttribute('fill');
    const stroke = node.getAttribute('stroke');
    const closed = /z\s*$/i.test(node.getAttribute('d'));
    if (fill && fill !== 'none') {
      last = { shape: paths[i], outlined: false, lines: [] };
      parts.push(last);
    } else if (stroke) {
      if (closed && last && !last.outlined) {
        last.shape = paths[i];               // outer contour wins (bases are drawn larger)
        last.outlined = true;
        last.lines.push(paths[i]);
      } else if (last) {
        last.lines.push(paths[i]);
      }
    }
  });
  return parts;
}

const parsed = {};
ORDER.forEach(n => parsed[n] = parsePiece(n));

// ---------- build meshes ----------
// Embossed outline: a flattened tube swept along the stroke centerline,
// half-sunk into the cap so it reads as a soft raised ridge.
function ridgeGeometry(sub) {
  const len = sub.getLength();
  if (len < 2) return null;
  const div = Math.max(24, Math.min(400, Math.round(len / 4)));
  let pts = sub.getSpacedPoints(div);
  const closed = pts[0].distanceTo(pts[pts.length - 1]) < 0.5;
  if (closed) pts = pts.slice(0, -1);
  if (pts.length < 3) return null;
  // Catmull-Rom through evenly spaced samples gently rounds sharp corners
  const curve = new THREE.CatmullRomCurve3(
    pts.map(p => new THREE.Vector3(p.x, p.y, 0)), closed, 'centripetal');
  const tube = new THREE.TubeGeometry(curve, div, RIDGE_R, 12, closed);
  let geo = tube;
  if (!closed) {                             // round end caps for open lines
    const ends = [0, 1].map(t => {
      const s = new THREE.SphereGeometry(RIDGE_R, 12, 8);
      const p = curve.getPoint(t);
      s.translate(p.x, p.y, 0);
      return s;
    });
    geo = BufferGeometryUtils.mergeGeometries([tube, ...ends]);
  }
  geo.deleteAttribute('uv');
  geo.scale(1, 1, RIDGE_FLATTEN);
  geo.computeVertexNormals();
  return geo;
}

function buildPiece(name, depthBase) {
  const inner = new THREE.Group();
  parsed[name].forEach((part, pi) => {
    const depth = depthBase + pi * 4;        // later-drawn parts sit proud, like the 2D layering
    const shapes = SVGLoader.createShapes(part.shape);
    let geo = new THREE.ExtrudeGeometry(shapes, {
      depth, bevelEnabled: true, bevelThickness: BEVEL_T, bevelSize: BEVEL_S,
      bevelSegments: 10, curveSegments: 24
    });
    geo.deleteAttribute('uv');
    // smooth-shade the rounded bevel and curved walls, keep truly sharp corners
    geo = BufferGeometryUtils.toCreasedNormals(geo, THREE.MathUtils.degToRad(50));
    geo.translate(0, 0, -depth / 2);
    const mesh = new THREE.Mesh(geo, bodyMat);
    mesh.castShadow = true;
    mesh.name = `${name}-part${pi}`;
    inner.add(mesh);

    const ridgeZ = depth / 2 + BEVEL_T - RIDGE_SINK;
    for (const lpath of part.lines) {
      for (const sub of lpath.subPaths) {
        const rg = ridgeGeometry(sub);
        if (!rg) continue;
        const front = new THREE.Mesh(rg, bodyMat);
        front.position.z = ridgeZ;
        const back = new THREE.Mesh(rg, bodyMat);
        back.position.z = -ridgeZ;
        front.castShadow = back.castShadow = true;
        inner.add(front, back);
      }
    }
  });
  // pivot at bottom-center so pieces stand on the floor and spin in place
  const box = new THREE.Box3().setFromObject(inner);
  inner.position.set(-(box.min.x + box.max.x) / 2, -box.min.y, 0);
  const outer = new THREE.Group();
  outer.name = name;
  outer.add(inner);
  return outer;
}

const piecesRoot = new THREE.Group();
scene.add(piecesRoot);
const pieceObjs = {};

function rebuild() {
  ORDER.forEach(name => {
    const prev = pieceObjs[name];
    const rotY = prev ? prev.rotation.y : 0;
    if (prev) {
      prev.traverse(o => o.geometry && o.geometry.dispose());
      piecesRoot.remove(prev);
    }
    const obj = buildPiece(name, state.depth);
    obj.rotation.y = rotY;
    pieceObjs[name] = obj;
    piecesRoot.add(obj);
  });
  layout();
}

let desiredDist = null;
function layout() {
  const showAll = state.piece === 'all';
  ORDER.forEach((name, i) => {
    const obj = pieceObjs[name];
    obj.visible = showAll || name === state.piece;
    obj.position.x = showAll ? (i - (ORDER.length - 1) / 2) * SPACING : 0;
  });
  desiredDist = showAll ? 1800 : 800;
}
controls.addEventListener('start', () => desiredDist = null); // user takes over

rebuild();

// ---------- UI ----------
document.querySelectorAll('#bar [data-piece]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.piece = btn.dataset.piece;
    document.querySelectorAll('#bar [data-piece]').forEach(b => b.classList.toggle('active', b === btn));
    layout();
  });
});
document.querySelectorAll('#bar [data-set]').forEach(btn => {
  btn.addEventListener('click', () => {
    state.set = btn.dataset.set;
    document.querySelectorAll('#bar [data-set]').forEach(b => b.classList.toggle('active', b === btn));
    bodyMat.color.setHex(COLORS[state.set].body);
  });
});
const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', () => {
  state.spin = !state.spin;
  spinBtn.classList.toggle('toggled', state.spin);
});
let depthTimer;
document.getElementById('depth').addEventListener('input', e => {
  state.depth = +e.target.value;
  clearTimeout(depthTimer);
  depthTimer = setTimeout(rebuild, 60);
});
document.getElementById('dl').addEventListener('click', () => {
  const src = state.piece === 'all' ? piecesRoot : pieceObjs[state.piece];
  const clone = src.clone(true);
  clone.traverse(o => o.rotation && o.rotation.set(0, 0, 0));
  new GLTFExporter().parse(clone, gltf => {
    const blob = new Blob([gltf], { type: 'model/gltf-binary' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = state.piece === 'all' ? 'chess-pieces.glb' : `chess-${state.piece}.glb`;
    a.click();
    URL.revokeObjectURL(a.href);
  }, err => console.error('GLB export failed', err), { binary: true });
});

// ---------- loop ----------
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (state.spin) ORDER.forEach(n => { if (pieceObjs[n].visible) pieceObjs[n].rotation.y += dt * 0.45; });
  if (desiredDist !== null) {
    const offset = camera.position.clone().sub(controls.target);
    const dist = offset.length();
    const next = THREE.MathUtils.lerp(dist, desiredDist, 1 - Math.exp(-4 * dt));
    camera.position.copy(controls.target).addScaledVector(offset.normalize(), next);
    if (Math.abs(next - desiredDist) < 2) desiredDist = null;
  }
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
