<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take Take Take — Game setup</title>
  <script>if (new URLSearchParams(location.search).get('compact') === '1') document.documentElement.classList.add('compact-preview');</script>
  <script src="gyro-tilt.js"></script>
  <style>
    @font-face {
      font-family: "ABC Diatype";
      src: url("fonts/ABCDiatype-Regular.otf") format("opentype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: "ABC Diatype";
      src: url("fonts/ABCDiatype-Bold.otf") format("opentype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }

    :root {
      --purple: #5d00ff;
      --purple-soft: #eeedff;
      --purple-fade: #b7a5ff;
      --aqua: #50cbc8;
      --ink: #2d2d2d;
      --muted: #8c8c8c;
      --line: #dddddd;
      --sheet: #fbfbfb;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #d3d3d3;
      color: var(--ink);
      font-family: "ABC Diatype", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      color: inherit;
      font: inherit;
    }

    .phone {
      position: relative;
      width: min(100vw, calc(100svh * .462), 430px);
      height: min(100svh, 931px);
      overflow: hidden;
      background: #f4f4f4;
      box-shadow: 0 22px 70px rgb(0 0 0 / .18);
    }

    html.compact-preview body { background:#cecece; }
    html.compact-preview .phone { transform:scale(.86); }

    .app-background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #f4f4f4;
    }

    .status-bar {
      position: absolute;
      z-index: 4;
      top: max(17px, env(safe-area-inset-top));
      right: 27px;
      left: 42px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #050505;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-icons svg {
      display: block;
      overflow: visible;
    }

    .home-content {
      position: absolute;
      inset: 74px 0 0;
      filter: blur(8px);
      transform: scale(1.025);
      opacity: .93;
    }

    .mini-profile {
      position: absolute;
      top: 4px;
      left: 34px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(145deg, #47352d, #a67c6f);
    }

    .notification-dot {
      position: absolute;
      top: 6px;
      left: 88px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ff765f;
    }

    .avatar-strip {
      position: absolute;
      top: 77px;
      left: 17px;
      display: flex;
      gap: 25px;
      width: max-content;
    }

    .avatar {
      position: relative;
      width: 82px;
      height: 72px;
      border-radius: 40px;
      border-bottom: 5px solid var(--purple);
      background: var(--avatar-bg, linear-gradient(145deg, #9d633b, #252a29));
      box-shadow: 0 8px 13px rgb(93 0 255 / .17);
    }

    .avatar::before,
    .avatar::after {
      position: absolute;
      top: 26px;
      width: 7px;
      height: 15px;
      border-radius: 999px;
      background: #fff;
      content: "";
    }

    .avatar::before { left: 27px; }
    .avatar::after { right: 27px; }

    .avatar:nth-child(2) { --avatar-bg: linear-gradient(145deg, #875952, #202530); }
    .avatar:nth-child(3) { --avatar-bg: linear-gradient(145deg, #edb000, #75541a); }
    .avatar:nth-child(4) { --avatar-bg: linear-gradient(145deg, #8a431c, #221915); }
    .avatar:nth-child(5) { --avatar-bg: linear-gradient(145deg, #c67837, #3b2113); }

    .feed-card {
      position: absolute;
      top: 246px;
      left: 24px;
      width: 124px;
      height: 138px;
      border-radius: 16px;
      background: linear-gradient(150deg, #d31f86 0%, #3b251b 55%, #171717 100%);
      box-shadow: 0 12px 28px rgb(0 0 0 / .12);
    }

    .screen-dimmer {
      position: absolute;
      z-index: 3;
      inset: 0;
      background: rgb(0 0 0 / .40);
      pointer-events: none;
    }

    .game-sheet {
      position: absolute;
      z-index: 5;
      inset: 34.75% 0 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
      padding: 0 16px max(16px, env(safe-area-inset-bottom));
      overflow: hidden;
      border-radius: 30px 30px 0 0;
      background: var(--sheet);
      box-shadow: 0 -2px 20px rgb(0 0 0 / .025);
    }

    .grabber {
      flex: none;
      width: 56px;
      height: 5px;
      margin: 12px auto 13px;
      border-radius: 999px;
      background: #e5e5e5;
    }

    .mode-tabs {
      display: grid;
      flex: none;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .mode-tab {
      display: flex;
      height: 76px;
      min-width: 0;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      padding: 8px 2px 7px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: border-color .18s ease, background .18s ease, color .18s ease, transform .18s ease;
    }

    .mode-tab:hover {
      border-color: #bdbdbd;
      transform: translateY(-1px);
    }

    .mode-tab:focus-visible,
    .preset:focus-visible,
    .level-node:focus-visible,
    .start-button:focus-visible {
      outline: 3px solid rgb(93 0 255 / .22);
      outline-offset: 2px;
    }

    .mode-tab[aria-selected="true"] {
      border: 1.5px solid var(--purple);
      background: var(--purple-soft);
      color: var(--purple);
    }

    .mode-icon {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .bot-avatar-slot {
      position: relative;
      display: block;
      width: 34px;
      height: 28px;
      overflow: visible;
    }

    .bot-avatar-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80px;
      height: 64px;
      border: 0;
      background: transparent;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(.46);
      transform-origin: center;
      transition: transform .18s ease;
    }

    .mode-panel {
      display: none;
      flex: 1;
      min-height: 0;
      animation: panel-in .22s ease both;
    }

    .mode-panel.active {
      display: flex;
      flex-direction: column;
    }

    @keyframes panel-in {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .online-panel {
      padding-top: 46px;
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }

    .section-title svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    .preset-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .preset {
      display: flex;
      height: 67px;
      justify-content: center;
      flex-direction: column;
      padding: 10px 17px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }

    .preset.selected {
      border: 1.5px solid var(--purple);
      background: var(--purple-soft);
      color: var(--purple);
    }

    .preset-type {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #8e8e8e;
      font-size: 14px;
      line-height: 1;
    }

    .preset.selected .preset-type {
      color: var(--purple);
    }

    .preset-type svg {
      width: 14px;
      height: 17px;
      fill: currentColor;
    }

    .preset-time {
      margin-top: 9px;
      font-size: 17px;
      line-height: 1;
    }

    .custom-game {
      display: flex;
      height: 50px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
      padding: 0 17px;
      border: 1px solid #e4e4e4;
      border-radius: 9px;
      background: transparent;
      color: #5a5a5a;
      font-size: 16px;
      font-weight: 700;
    }

    .chevron {
      width: 11px;
      height: 11px;
      border-top: 3px solid currentColor;
      border-left: 3px solid currentColor;
      transform: translateY(3px) rotate(45deg);
    }

    .bot-panel {
      padding-top: 86px;
    }

    .level-card {
      height: 147px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fcfcfc;
    }

    .level-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 19px 14px 0;
      font-size: 16px;
    }

    .level-heading span:last-child {
      color: var(--muted);
    }

    .level-track-wrap {
      position: relative;
      height: 90px;
      margin-top: 8px;
      overflow: hidden;
    }

    .level-track-wrap::before {
      position: absolute;
      top: 51px;
      right: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #d9c8ff 0%, var(--purple) 68%, #eeeaff 68%);
      content: "";
    }

    .level-track {
      position: absolute;
      top: 20px;
      left: -30px;
      display: flex;
      width: max-content;
      align-items: center;
      gap: 17px;
    }

    .level-node {
      position: relative;
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      flex: none;
      border: 2px solid var(--purple);
      border-radius: 50%;
      background: #f6f3ff;
      color: var(--purple);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
    }

    .level-node::after {
      position: absolute;
      z-index: -1;
      inset: 48% -19px auto;
      height: 3px;
      background: var(--purple);
      content: "";
    }

    .level-node .flame {
      position: absolute;
      top: -12px;
      right: -6px;
      width: 18px;
      height: 22px;
      fill: var(--aqua);
    }

    .level-node.selected {
      width: 55px;
      height: 55px;
      border: 3px solid #6550e8;
      background: linear-gradient(145deg, #745cff, #6550e8);
      box-shadow: 2px 4px 0 #77d8da;
      color: #fff;
      font-size: 22px;
    }

    .level-node.locked {
      border: 0;
      background: #f0edff;
      color: #ad98ff;
    }

    .level-node.locked::after {
      background: #eeeaff;
    }

    .level-node.locked .lock {
      position: absolute;
      top: -8px;
      right: 0;
      width: 12px;
      height: 12px;
      fill: var(--purple);
    }

    .puzzle-toggle {
      display: flex;
      width: 136px;
      height: 55px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin: 12px 0 0 1px;
      border: 1px solid #2d2d2d;
      background: transparent;
      cursor: pointer;
      font-size: 12px;
    }

    .puzzle-toggle::before {
      width: 14px;
      height: 14px;
      border: 1px solid #5a5a5a;
      content: "";
    }

    .puzzle-toggle.on::before {
      border-color: var(--purple);
      background: var(--purple);
      box-shadow: inset 0 0 0 3px #fff;
    }

    .simple-panel {
      justify-content: center;
      padding: 0 20px 86px;
      text-align: center;
    }

    .simple-panel h2 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    .simple-panel p {
      margin: 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.4;
    }

    .sheet-footer {
      position: absolute;
      right: 16px;
      bottom: max(42px, calc(env(safe-area-inset-bottom) + 26px));
      left: 16px;
      z-index: 2;
      transition: transform .18s ease;
    }

    .start-button {
      display: flex;
      width: 100%;
      height: 49px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 0;
      border-radius: 999px;
      background: var(--purple);
      box-shadow: 0 7px 10px rgb(93 0 255 / .22);
      color: #fff;
      cursor: pointer;
      font-size: 18px;
      font-weight: 700;
      transition: transform .16s ease, box-shadow .16s ease;
    }

    .start-button:active {
      transform: translateY(2px);
      box-shadow: 0 4px 7px rgb(93 0 255 / .2);
    }

    .start-button svg {
      width: 20px;
      height: 25px;
      fill: currentColor;
    }

    .powered-by {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 18px;
      color: #818181;
      font-size: 14px;
    }

    .powered-by svg {
      width: 19px;
      height: 19px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.4;
    }

    .game-sheet[data-active-mode="bot"] .powered-by,
    .game-sheet[data-active-mode="friend"] .powered-by,
    .game-sheet[data-active-mode="puzzles"] .powered-by {
      display: none;
    }

    .game-sheet[data-active-mode="bot"] .sheet-footer {
      bottom: max(80px, calc(env(safe-area-inset-bottom) + 64px));
    }

    .game-sheet[data-active-mode="friend"] .sheet-footer,
    .game-sheet[data-active-mode="puzzles"] .sheet-footer {
      bottom: max(38px, calc(env(safe-area-inset-bottom) + 20px));
    }

    @media (min-width: 431px) {
      .phone {
        border-radius: 34px;
      }
    }

    @media (max-height: 760px) {
      .game-sheet { inset: 31% 0 0; }
      .online-panel { padding-top: 25px; }
      .bot-panel { padding-top: 45px; }
      .game-sheet[data-active-mode="bot"] .sheet-footer { bottom: 22px; }
      .powered-by { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="Mobile game setup preview">
    <section class="app-background" aria-hidden="true">
      <div class="home-content">
        <div class="mini-profile"></div>
        <div class="notification-dot"></div>
        <div class="avatar-strip">
          <div class="avatar"></div>
          <div class="avatar"></div>
          <div class="avatar"></div>
          <div class="avatar"></div>
          <div class="avatar"></div>
        </div>
        <div class="feed-card"></div>
      </div>
      <div class="screen-dimmer"></div>
      <div class="status-bar">
        <span id="clock">12:26</span>
        <span class="status-icons">
          <svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true">
            <rect x="0" y="9" width="3.5" height="5" rx="1" fill="currentColor"/>
            <rect x="5.4" y="6" width="3.5" height="8" rx="1" fill="currentColor"/>
            <rect x="10.8" y="3" width="3.5" height="11" rx="1" fill="currentColor"/>
            <rect x="16.2" width="3.5" height="14" rx="1" fill="currentColor" opacity=".2"/>
          </svg>
          <svg width="19" height="14" viewBox="0 0 19 14" aria-hidden="true">
            <path d="M1 4.5C5.9.1 13.1.1 18 4.5L15.9 6.8C12.3 3.7 6.7 3.7 3.1 6.8L1 4.5Zm4 4.2c2.5-2.1 6.5-2.1 9 0l-2.2 2.2c-1.3-1.1-3.3-1.1-4.6 0L5 8.7Zm3.2 3.5c.7-.7 1.9-.7 2.6 0L9.5 14l-1.3-1.8Z" fill="currentColor"/>
          </svg>
          <svg width="28" height="14" viewBox="0 0 28 14" aria-hidden="true">
            <rect x=".5" y=".5" width="24" height="13" rx="4" fill="none" stroke="currentColor" opacity=".45"/>
            <rect x="2.5" y="2.5" width="11" height="9" rx="2.5" fill="currentColor"/>
            <path d="M26 4.5v5c1.3-.2 2-.9 2-2.5s-.7-2.3-2-2.5Z" fill="currentColor" opacity=".45"/>
          </svg>
        </span>
      </div>
    </section>

    <section class="game-sheet" data-active-mode="online" aria-label="Choose a game mode">
      <div class="grabber" aria-hidden="true"></div>

      <div class="mode-tabs" role="tablist" aria-label="Game modes">
        <button class="mode-tab" id="tab-online" role="tab" aria-selected="true" aria-controls="panel-online" data-mode="online">
          <svg class="mode-icon" viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="3"/>
            <path d="M3 16h26M16 3c-4 4.2-6 8.5-6 13s2 8.8 6 13M16 3c4 4.2 6 8.5 6 13s-2 8.8-6 13" fill="none" stroke="currentColor" stroke-width="3"/>
          </svg>
          <span>Online</span>
        </button>
        <button class="mode-tab" id="tab-bot" role="tab" aria-selected="false" aria-controls="panel-bot" data-mode="bot">
          <span class="bot-avatar-slot" aria-hidden="true">
            <iframe class="bot-avatar-frame" id="bot-avatar-frame" src="index.html?avatar-icon=1&amp;profile=setup&amp;icon-fit=1&amp;avatar-mirror=1&amp;v=23" title="" tabindex="-1"></iframe>
          </span>
          <span>Bot</span>
        </button>
        <button class="mode-tab" id="tab-friend" role="tab" aria-selected="false" aria-controls="panel-friend" data-mode="friend">
          <svg class="mode-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M27.5 3 17 13.5l-2-2-4 4 2.3 2.3-7.8 7.7 1 3 3 1 7.7-7.8 2.3 2.3 4-4-2-2L32 7.5V3h-4.5Z"/>
          </svg>
          <span>Friend</span>
        </button>
        <button class="mode-tab" id="tab-puzzles" role="tab" aria-selected="false" aria-controls="panel-puzzles" data-mode="puzzles">
          <svg class="mode-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path d="M4 10h9V4.7C13 2.1 15 0 17.5 0S22 2.1 22 4.7c0 2.1-1.3 3.9-3.2 4.5V10H28v9h-.8c-.7-1.8-2.4-3-4.4-3-2.7 0-4.8 2.2-4.8 5s2.1 5 4.8 5c2 0 3.7-1.2 4.4-3h.8v9H4V10Z"/>
          </svg>
          <span>Puzzles</span>
        </button>
      </div>

      <section class="mode-panel online-panel active" id="panel-online" role="tabpanel" aria-labelledby="tab-online" data-mode="online">
        <h2 class="section-title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.2 10.6 20C5.4 15.4 2 12.3 2 8.5 2 5.4 4.4 3 7.5 3c1.8 0 3.5.8 4.5 2.1C13 3.8 14.7 3 16.5 3 19.6 3 22 5.4 22 8.5c0 3.8-3.4 6.9-8.6 11.5L12 21.2Z"/></svg>
          Your presets
        </h2>
        <div class="preset-grid" aria-label="Time controls">
          <button class="preset selected" data-preset="5+3">
            <span class="preset-type">
              <svg viewBox="0 0 18 24" aria-hidden="true"><path d="M7 0h10L11 9h5L3 24l4-11H1L7 0Z"/></svg>
              Blitz
            </span>
            <span class="preset-time">5 min + 3 sec</span>
          </button>
          <button class="preset" data-preset="3+2">
            <span class="preset-type">
              <svg viewBox="0 0 18 24" aria-hidden="true"><path d="M7 0h10L11 9h5L3 24l4-11H1L7 0Z"/></svg>
              Blitz
            </span>
            <span class="preset-time">3 min + 2 sec</span>
          </button>
          <button class="preset" data-preset="10+0">
            <span class="preset-type"><span aria-hidden="true">♞</span> Rapid</span>
            <span class="preset-time">10 min</span>
          </button>
          <button class="preset" data-preset="10+5">
            <span class="preset-type"><span aria-hidden="true">♞</span> Rapid</span>
            <span class="preset-time">10 min + 5 sec</span>
          </button>
        </div>
        <button class="custom-game" type="button">
          <span>Custom game</span>
          <span class="chevron" aria-hidden="true"></span>
        </button>
      </section>

      <section class="mode-panel bot-panel" id="panel-bot" role="tabpanel" aria-labelledby="tab-bot" data-mode="bot">
        <div class="level-card">
          <div class="level-heading"><span>Level</span><span id="level-name">Intermediate</span></div>
          <div class="level-track-wrap">
            <div class="level-track" aria-label="Bot level">
              <button class="level-node" data-level="11" aria-label="Level 11">11</button>
              <button class="level-node" data-level="12" aria-label="Level 12">
                12
                <svg class="flame" viewBox="0 0 24 30" aria-hidden="true"><path d="M13 0c2 6-2 8 1 11 2-4 6-5 5-10 5 5 7 10 4 16-2 5-6 8-11 8C5 25 0 21 0 15 0 10 3 7 7 4c-1 5 0 8 2 9 0-5 1-8 4-13Z"/></svg>
              </button>
              <button class="level-node" data-level="13" aria-label="Level 13">
                13
                <svg class="flame" viewBox="0 0 24 30" aria-hidden="true"><path d="M13 0c2 6-2 8 1 11 2-4 6-5 5-10 5 5 7 10 4 16-2 5-6 8-11 8C5 25 0 21 0 15 0 10 3 7 7 4c-1 5 0 8 2 9 0-5 1-8 4-13Z"/></svg>
              </button>
              <button class="level-node" data-level="14" aria-label="Level 14">
                14
                <svg class="flame" viewBox="0 0 24 30" aria-hidden="true"><path d="M13 0c2 6-2 8 1 11 2-4 6-5 5-10 5 5 7 10 4 16-2 5-6 8-11 8C5 25 0 21 0 15 0 10 3 7 7 4c-1 5 0 8 2 9 0-5 1-8 4-13Z"/></svg>
              </button>
              <button class="level-node" data-level="15" aria-label="Level 15">
                15
                <svg class="flame" viewBox="0 0 24 30" aria-hidden="true"><path d="M13 0c2 6-2 8 1 11 2-4 6-5 5-10 5 5 7 10 4 16-2 5-6 8-11 8C5 25 0 21 0 15 0 10 3 7 7 4c-1 5 0 8 2 9 0-5 1-8 4-13Z"/></svg>
              </button>
              <button class="level-node selected" data-level="16" aria-label="Level 16, selected">16</button>
              <button class="level-node locked" data-level="17" aria-label="Level 17, locked" disabled>
                17
                <svg class="lock" viewBox="0 0 16 18" aria-hidden="true"><path d="M4 7V5a4 4 0 0 1 8 0v2h2v10H2V7h2Zm2 0h4V5a2 2 0 1 0-4 0v2Z"/></svg>
              </button>
            </div>
          </div>
        </div>
        <button class="puzzle-toggle" type="button" aria-pressed="false">with puzzles</button>
      </section>

      <section class="mode-panel simple-panel" id="panel-friend" role="tabpanel" aria-labelledby="tab-friend" data-mode="friend">
        <h2>Play a friend</h2>
        <p>Create a private challenge and send the invite link to a friend.</p>
      </section>

      <section class="mode-panel simple-panel" id="panel-puzzles" role="tabpanel" aria-labelledby="tab-puzzles" data-mode="puzzles">
        <h2>Puzzle streak</h2>
        <p>Warm up with a short run of tactical positions.</p>
      </section>

      <footer class="sheet-footer">
        <button class="start-button" type="button">
          <svg viewBox="0 0 32 38" aria-hidden="true">
            <path d="M14 4a5 5 0 1 1 10 0c0 2.4-1.6 4.4-3.8 4.9L22 14h4v5h-3l3 15H10l3-15H8v-5h4l1.8-5.1A5 5 0 0 1 14 4ZM0 19h9v4H0v-4Zm4 7h7v4H4v-4Z"/>
          </svg>
          <span id="start-label">Start game</span>
        </button>
        <div class="powered-by" aria-label="Powered by Lichess">
          <svg viewBox="0 0 30 30" aria-hidden="true"><path d="M19.5 3c-1 3.6.2 6.8 3.5 9.4-2.8.5-4.2 2.4-4 5.6 1.4 1.7 2.6 3.5 2.6 5.8C19 27 15.6 28 11.7 26.7 7 25.1 4 21.2 4.2 17.4c.2-3.2 2.5-4.3 5.8-5.8-1.3-3.4-.5-6.3 2.3-8.6.7 2.5 2.4 4.4 5 5.7-.2-2.4.5-4.3 2.2-5.7Z"/></svg>
          Powered by Lichess
        </div>
      </footer>
    </section>
  </main>

  <script>
    const sheet = document.querySelector('.game-sheet');
    const tabs = [...document.querySelectorAll('.mode-tab')];
    const panels = [...document.querySelectorAll('.mode-panel')];
    const startLabel = document.getElementById('start-label');
    const clock = document.getElementById('clock');
    const phone = document.querySelector('.phone');
    const botAvatarFrame = document.getElementById('bot-avatar-frame');
    const startLabels = {
      online: 'Start game',
      bot: 'Start game',
      friend: 'Create game',
      puzzles: 'Start puzzles',
    };

    function selectMode(mode) {
      sheet.dataset.activeMode = mode;
      tabs.forEach(tab => {
        const selected = tab.dataset.mode === mode;
        tab.setAttribute('aria-selected', selected);
        tab.tabIndex = selected ? 0 : -1;
      });
      panels.forEach(panel => panel.classList.toggle('active', panel.dataset.mode === mode));
      startLabel.textContent = startLabels[mode];
      clock.textContent = mode === 'bot' ? '13:43' : '12:26';
      if (mode === 'bot') exciteBot();
    }

    let avatarPointer = { x: 0, y: 0 };
    let mirrorActive = false;
    let lastMirrorPose = null;

    function sendAvatar(message) {
      botAvatarFrame.contentWindow?.postMessage(message, location.origin);
    }

    function exciteBot() {
      if (mirrorActive && window.parent !== window) {
        window.parent.postMessage({ type:'avatar-state-request', profile:'setup', state:'excited' }, location.origin);
        return;
      }
      sendAvatar({ type:'avatar-state', state:'excited' });
    }

    function sendAvatarPointer() {
      sendAvatar({ type: 'avatar-pointer', ...avatarPointer });
    }

    botAvatarFrame.addEventListener('load', () => {
      if (mirrorActive && lastMirrorPose) sendAvatar({ type:'avatar-mirror-pose', pose:lastMirrorPose });
      else sendAvatarPointer();
    });
    window.addEventListener('pointermove', event => {
      if (mirrorActive) return;
      const bounds = phone.getBoundingClientRect();
      avatarPointer = {
        x: Math.max(-1, Math.min(1, (event.clientX - bounds.left - bounds.width / 2) / (bounds.width / 2))),
        y: Math.max(-1, Math.min(1, (event.clientY - bounds.top - bounds.height / 2) / (bounds.height / 2))),
      };
      sendAvatarPointer();
    }, { passive: true });

    document.documentElement.addEventListener('mouseleave', () => {
      if (mirrorActive) return;
      avatarPointer = { x: 0, y: 0 };
      sendAvatarPointer();
    });

    /* Phones have no cursor: device tilt feeds the avatar the same look vector
       the pointer would. Only when this page is the real screen — inside the
       test workbench the editor drives the pose. */
    if (window.parent === window && typeof startGyroTilt === 'function') {
      startGyroTilt(tilt => {
        if (mirrorActive) return;
        avatarPointer = { x: tilt.x, y: tilt.y };
        sendAvatarPointer();
      });
    }

    window.addEventListener('message', event => {
      if (event.origin !== location.origin || !event.data || typeof event.data !== 'object') return;
      if (event.data.type === 'avatar-state-command' && event.data.state) {
        mirrorActive = false;
        lastMirrorPose = null;
        sendAvatar({ type:'avatar-mirror-stop' });
        sendAvatar({ type:'avatar-state', state:event.data.state });
        return;
      }
      if (event.data.type === 'avatar-mirror-pose' && event.data.pose) {
        mirrorActive = true;
        lastMirrorPose = event.data.pose;
        sendAvatar({ type:'avatar-mirror-pose', pose:lastMirrorPose });
        return;
      }
      if (event.data.type === 'avatar-mirror-stop') {
        mirrorActive = false;
        lastMirrorPose = null;
        sendAvatar({ type:'avatar-mirror-stop' });
      }
    });

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => {
        selectMode(tab.dataset.mode);
      });
      tab.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const next = tabs[(index + direction + tabs.length) % tabs.length];
        selectMode(next.dataset.mode);
        next.focus();
      });
    });

    document.querySelectorAll('.preset').forEach(preset => {
      preset.addEventListener('click', () => {
        document.querySelectorAll('.preset').forEach(item => item.classList.toggle('selected', item === preset));
      });
    });

    document.querySelectorAll('.level-node:not(.locked)').forEach(level => {
      level.addEventListener('click', () => {
        document.querySelectorAll('.level-node').forEach(item => item.classList.toggle('selected', item === level));
        document.getElementById('level-name').textContent = Number(level.dataset.level) < 14 ? 'Casual' : Number(level.dataset.level) < 16 ? 'Advanced' : 'Intermediate';
      });
    });

    document.querySelector('.puzzle-toggle').addEventListener('click', event => {
      const enabled = event.currentTarget.getAttribute('aria-pressed') !== 'true';
      event.currentTarget.setAttribute('aria-pressed', enabled);
      event.currentTarget.classList.toggle('on', enabled);
    });

    document.addEventListener('keydown', event => {
      if (event.key.toLowerCase() !== 'p' || event.metaKey || event.ctrlKey || event.altKey || event.repeat) return;
      event.preventDefault();
      if (window.parent !== window) {
        window.parent.postMessage({ type:'generator-home-request', profile:'setup' }, location.origin);
      } else {
        location.href = 'index.html?profile=setup&v=23';
      }
    });

    selectMode('online');
  </script>
</body>
