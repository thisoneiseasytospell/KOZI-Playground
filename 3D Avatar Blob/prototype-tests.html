<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Take Take Take — Prototype frames</title>
  <style>
    @font-face {
      font-family:"ABC Diatype";
      src:url("fonts/ABCDiatype-Regular.otf") format("opentype");
      font-weight:400;
      font-display:swap;
    }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body {
      overflow:hidden;
      background:#1a1a1a;
      color:#fff;
      font-family:"ABC Diatype", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, a { color:inherit; font:inherit; }
    .workspace { position:fixed; inset:0; display:grid; background:#cecece; }
    .workspace[data-editing="true"] { grid-template-columns:minmax(700px, 1fr) minmax(440px, 520px); }
    .pane { position:relative; min-width:0; min-height:0; overflow:hidden; }
    .editor-pane { display:none; background:#d9d9d3; }
    .workspace[data-editing="true"] .editor-pane { display:block; }
    .workspace[data-editing="true"] .preview-pane {
      padding:28px; border-left:1px solid #11110f; background:#cecece;
    }
    .top-controls {
      position:fixed; z-index:5; top:max(14px, env(safe-area-inset-top));
      right:max(14px, env(safe-area-inset-right));
      display:flex; align-items:center; gap:7px;
    }
    .frames {
      position:fixed; z-index:5; right:max(16px, env(safe-area-inset-right)); bottom:max(16px, env(safe-area-inset-bottom));
      display:flex; min-width:0; gap:5px; padding:5px;
      border:1px solid #3a3a3a; border-radius:999px;
      background:rgb(20 20 20 / .92); box-shadow:0 8px 28px rgb(0 0 0 / .3);
      backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    }
    .frame-button {
      width:44px; height:44px; padding:0;
      border:1px solid transparent; border-radius:999px;
      background:transparent; cursor:pointer; font-size:14px; font-weight:700; white-space:nowrap;
    }
    .frame-button:hover { background:#292929; }
    .frame-button:focus-visible { outline:2px solid #fff; outline-offset:2px; }
    .frame-button[aria-selected="true"] { border-color:#7429ff; background:#5d00ff; }
    .mode-button {
      height:38px; padding:0 15px; flex:none;
      border:1px solid #5b5b5b; border-radius:999px;
      background:rgb(24 24 24 / .92); cursor:pointer; font-size:13px;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    }
    .mode-button[aria-pressed="true"] { border-color:#8b57ff; background:#5d00ff; }
    .home-button {
      display:grid; width:38px; height:38px; place-items:center; flex:none;
      border:1px solid #444; border-radius:50%; background:rgb(24 24 24 / .92);
      text-decoration:none; cursor:pointer;
      backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    }
    .home-button svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-linecap:round; stroke-linejoin:round; stroke-width:2; }
    .preview {
      display:block; width:100%; height:100%; border:0; background:#cecece;
    }
    @media (max-width:1180px) {
      .workspace[data-editing="true"] { grid-template-columns:1fr; grid-template-rows:minmax(0, 1fr) minmax(280px, .5fr); }
      .workspace[data-editing="true"] .preview-pane { padding:20px; border-top:1px solid #11110f; border-left:0; }
    }
    @media (max-width:520px) {
      .frames { right:max(10px, env(safe-area-inset-right)); bottom:max(10px, env(safe-area-inset-bottom)); }
      .frame-button { width:40px; height:40px; font-size:12px; }
      .top-controls { top:max(10px, env(safe-area-inset-top)); right:max(10px, env(safe-area-inset-right)); }
      .mode-button { height:36px; padding:0 12px; font-size:12px; }
      .home-button { width:36px; height:36px; }
    }
  </style>
</head>
<body>
  <div class="workspace" id="workspace" data-editing="false">
    <section class="pane editor-pane" aria-label="Avatar editor">
      <iframe class="preview" id="editor" src="about:blank" title="Avatar editor"></iframe>
    </section>
    <section class="pane preview-pane" aria-label="Live app preview">
      <iframe class="preview" id="preview" src="mobile-game-preview.html?v=23" title="Screen 1 prototype frame"></iframe>
    </section>
  </div>

  <div class="top-controls" aria-label="View controls">
    <button class="mode-button" id="edit-mode" type="button" aria-pressed="false">Editor</button>
    <a class="home-button" id="generator-home" href="index.html?profile=setup&amp;v=23" aria-label="Open avatar editor">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10M9.5 20v-6h5v6"/></svg>
    </a>
  </div>

  <nav class="frames" role="tablist" aria-label="Choose a screen">
    <button class="frame-button" role="tab" aria-selected="true" data-frame="setup" aria-label="Screen 1">1</button>
    <button class="frame-button" role="tab" aria-selected="false" data-frame="live" aria-label="Screen 2">2</button>
    <button class="frame-button" role="tab" aria-selected="false" data-frame="result" aria-label="Screen 3">3</button>
  </nav>

  <script>
    const routes = {
      setup: { url:'mobile-game-preview.html?v=23', title:'Screen 1 prototype frame' },
      live: { url:'mobile-match-preview.html?state=live&v=23', title:'Screen 2 prototype frame' },
      result: { url:'mobile-match-preview.html?state=result&v=23', title:'Screen 3 prototype frame' },
    };
    const buttons = [...document.querySelectorAll('.frame-button')];
    const workspace = document.getElementById('workspace');
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const generatorHome = document.getElementById('generator-home');
    const editModeButton = document.getElementById('edit-mode');
    let selectedScreen = 'setup';
    let editing = false;
    let lastMirrorPose = null;

    function editorRoute() {
      const label = selectedScreen[0].toUpperCase() + selectedScreen.slice(1);
      return {
        url:`index.html?profile=${encodeURIComponent(selectedScreen)}&mirror-source=1&v=23`,
        title:`Avatar editor for ${label}`,
      };
    }

    function renderRoute(updateHash = true) {
      const editorTarget = editorRoute();
      const previewTarget = routes[selectedScreen];
      const previewURL = editing ? `${previewTarget.url}&compact=1` : previewTarget.url;
      if (preview.getAttribute('src') !== previewURL) preview.src = previewURL;
      preview.title = previewTarget.title;
      if (editing && editor.getAttribute('src') !== editorTarget.url) editor.src = editorTarget.url;
      if (!editing && editor.getAttribute('src') !== 'about:blank') editor.src = 'about:blank';
      editor.title = editorTarget.title;
      workspace.dataset.editing = String(editing);
      generatorHome.href = editorTarget.url;
      buttons.forEach(button => button.setAttribute('aria-selected', String(button.dataset.frame === selectedScreen)));
      editModeButton.setAttribute('aria-pressed', String(editing));
      editModeButton.textContent = editing ? 'Close editor' : 'Editor';
      if (!editing) preview.contentWindow?.postMessage(lastMirrorPose
        ? { type:'avatar-mirror-pose', pose:lastMirrorPose }
        : { type:'avatar-mirror-stop' }, location.origin);
      if (updateHash) history.replaceState(null, '', editing ? `#editor-${selectedScreen}` : `#${selectedScreen}`);
    }

    function selectScreen(name, updateHash = true) {
      if (!routes[name]) return;
      if (selectedScreen !== name) lastMirrorPose = null;
      selectedScreen = name;
      renderRoute(updateHash);
    }

    buttons.forEach((button, index) => {
      button.addEventListener('click', () => selectScreen(button.dataset.frame));
      button.addEventListener('keydown', event => {
        if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
        event.preventDefault();
        const direction = event.key === 'ArrowRight' ? 1 : -1;
        const next = buttons[(index + direction + buttons.length) % buttons.length];
        selectScreen(next.dataset.frame);
        next.focus();
      });
    });
    editModeButton.addEventListener('click', () => {
      editing = !editing;
      renderRoute();
    });
    window.addEventListener('message', event => {
      if (event.origin !== location.origin) return;
      if (event.source === editor.contentWindow && event.data?.type === 'avatar-editor-pose') {
        if (!editing || event.data.profile !== selectedScreen || !event.data.pose) return;
        lastMirrorPose = event.data.pose;
        preview.contentWindow?.postMessage({ type:'avatar-mirror-pose', pose:lastMirrorPose }, location.origin);
        return;
      }
      if (event.data?.type === 'avatar-preview-request') {
        if (routes[event.data.profile]) selectedScreen = event.data.profile;
        editing = false;
        renderRoute();
        return;
      }
      if (event.data?.type === 'avatar-state-request' && event.data.state) {
        if (editing && editor.contentWindow) {
          editor.contentWindow.postMessage({ type:'avatar-state', state:event.data.state }, location.origin);
        } else {
          lastMirrorPose = null;
          preview.contentWindow?.postMessage({ type:'avatar-state-command', state:event.data.state }, location.origin);
        }
        return;
      }
      if (event.data?.type === 'generator-home-request') {
        if (routes[event.data.profile]) selectedScreen = event.data.profile;
        editing = true;
        renderRoute();
      }
    });
    preview.addEventListener('load', () => {
      if (lastMirrorPose) {
        preview.contentWindow?.postMessage({ type:'avatar-mirror-pose', pose:lastMirrorPose }, location.origin);
      } else {
        preview.contentWindow?.postMessage({ type:'avatar-mirror-stop' }, location.origin);
      }
    });
    window.addEventListener('keydown', event => {
      if (event.key.toLowerCase() === 'p' && !editing && !event.metaKey && !event.ctrlKey && !event.altKey && !event.repeat) {
        event.preventDefault();
        editing = true;
        renderRoute();
        return;
      }
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;
      if (document.activeElement?.classList.contains('frame-button')) return;
      const currentIndex = buttons.findIndex(button => button.dataset.frame === selectedScreen);
      const direction = event.key === 'ArrowRight' ? 1 : -1;
      selectScreen(buttons[(currentIndex + direction + buttons.length) % buttons.length].dataset.frame);
    });

    const hash = location.hash.slice(1);
    editing = hash.startsWith('editor-');
    const hashScreen = editing ? hash.slice(7) : hash;
    selectedScreen = routes[hashScreen] ? hashScreen : 'setup';
    renderRoute(false);
  </script>
</body>
</html>
