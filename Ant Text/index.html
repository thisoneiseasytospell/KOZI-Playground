<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ant Text — legible only in motion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0d0d0d; color: #b5b5b5; overflow: hidden; }
  body { font: 12px/1.4 ui-monospace, "SF Mono", Menlo, monospace; display: flex; flex-direction: column; }
  #bar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 14px; background: #141414; border-bottom: 1px solid #232323;
    user-select: none;
  }
  #bar label { display: flex; align-items: center; gap: 6px; color: #7a7a7a; }
  #bar textarea {
    background: #0d0d0d; border: 1px solid #2c2c2c; color: #d5d5d5;
    font: inherit; padding: 5px 8px; width: 240px; height: 52px;
    border-radius: 3px; resize: vertical;
  }
  #bar textarea:focus { outline: none; border-color: #4a4a4a; }
  #bar select {
    background: #0d0d0d; border: 1px solid #2c2c2c; color: #d5d5d5;
    font: inherit; padding: 4px 6px; border-radius: 3px;
  }
  #bar input[type="range"] { width: 100px; accent-color: #888; }
  #bar .val { color: #d5d5d5; min-width: 3.5ch; text-align: right; }
  #pause {
    background: #0d0d0d; border: 1px solid #2c2c2c; color: #d5d5d5;
    font: inherit; padding: 5px 14px; border-radius: 3px; cursor: pointer;
  }
  #pause:hover { border-color: #4a4a4a; }
  #hint { color: #5a5a5a; margin-left: auto; }
  #stage { flex: 1; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }
</style>
</head>
<body>
  <div id="bar">
    <label>text <textarea id="text" spellcheck="false">All that we see or seem
is but a dream within a dream</textarea></label>
    <label>size <input id="size" type="range" min="10" max="160" step="1" value="56"><span class="val" id="sizeVal">56</span></label>
    <label>mode
      <select id="mode">
        <option value="0" selected>swim — dashes march, verses ride the wave</option>
        <option value="1">weave — two streams cross on the outlines</option>
        <option value="2">pulse — dashes breathe as they travel</option>
        <option value="3">skeleton — dashes on the letter centerlines</option>
        <option value="4">reveal — the wave washes legibility across</option>
        <option value="5">ink — strokes stretch on straights, rush on curves</option>
      </select>
    </label>
    <label>speed <input id="speed" type="range" min="0.25" max="4" step="0.25" value="1.5"><span class="val" id="speedVal">1.5</span></label>
    <label>wave <input id="wave" type="range" min="0" max="3" step="0.25" value="1"><span class="val" id="waveVal">1</span></label>
    <label>scale
      <select id="grain">
        <option value="1" selected>fine</option>
        <option value="2">medium</option>
        <option value="4">coarse</option>
      </select>
    </label>
    <label>fps
      <select id="fps">
        <option value="24" selected>24</option>
        <option value="30">30</option>
        <option value="60">60</option>
      </select>
    </label>
    <button id="pause">pause</button>
    <span id="hint">click canvas or space to pause — judge the still frame</span>
  </div>
  <div id="stage"><canvas id="c"></canvas></div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const ui = {
    text:  document.getElementById('text'),
    size:  document.getElementById('size'),
    mode:  document.getElementById('mode'),
    speed: document.getElementById('speed'),
    wave:  document.getElementById('wave'),
    grain: document.getElementById('grain'),
    fps:   document.getElementById('fps'),
    pause: document.getElementById('pause'),
    sizeVal:  document.getElementById('sizeVal'),
    speedVal: document.getElementById('speedVal'),
    waveVal:  document.getElementById('waveVal'),
  };

  // ---- state ----
  let W = 0, H = 0, S = 1;          // buffer size (device px) and render scale
  let mask = null;                  // Uint8Array, 1 = inside a glyph
  let contours = [];                // arrays of packed pixel indices along outlines
  let contStraight = [];            // per-contour straightness 0..1 per point (ink mode)
  let skelPaths = null;             // centerline paths, computed lazily (skeleton mode)
  let img = null, buf32 = null;     // ImageData + 32-bit view
  let frame = 0, offAcc = 0;
  let playing = true, raf = 0;

  const ON  = 0xffe9e9e9;           // little-endian ABGR
  const OFF = 0xff0d0d0d;

  // Pattern scale multiplier from the scale select.
  const scaleF = () => ({ 1: 1, 2: 1.5, 4: 2 })[+ui.grain.value];

  function rebuild() {
    const r = canvas.parentElement.getBoundingClientRect();
    const cssW = Math.max(1, r.width), cssH = Math.max(1, r.height);
    S = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(2.2e6 / (cssW * cssH)));
    S = Math.max(S, 1);
    W = Math.round(cssW * S);
    H = Math.round(cssH * S);
    canvas.width = W;
    canvas.height = H;

    const m = document.createElement('canvas');
    m.width = W; m.height = H;
    const mc = m.getContext('2d', { willReadFrequently: true });
    mc.fillStyle = '#fff';
    mc.textAlign = 'center';
    mc.textBaseline = 'middle';

    const lines = ui.text.value.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) lines.push(' ');

    const font = px => `900 ${px}px system-ui, -apple-system, sans-serif`;
    let px = +ui.size.value * S;
    mc.font = font(px);
    const maxW = Math.max(...lines.map(l => mc.measureText(l).width));
    if (maxW > W * 0.92) px *= (W * 0.92) / maxW;
    let lineH = px * 1.32;
    if (lines.length * lineH > H * 0.72) {
      px *= (H * 0.72) / (lines.length * lineH);
      lineH = px * 1.32;
    }
    mc.font = font(px);
    const y0 = H * 0.46 - (lines.length - 1) * lineH / 2;
    lines.forEach((l, k) => mc.fillText(l, W / 2, y0 + k * lineH));

    // Fixed small line proving the effect survives tiny sizes.
    const capY = H - 40 * S;
    const blockBottom = y0 + (lines.length - 1) * lineH + lineH / 2;
    if (H / S > 260 && capY - blockBottom > 30 * S) {
      mc.font = `700 ${13 * S}px system-ui, -apple-system, sans-serif`;
      mc.fillText('this line is 13px — readable only in motion', W / 2, capY);
    }

    const d = mc.getImageData(0, 0, W, H).data;
    mask = new Uint8Array(W * H);
    for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4 + 3] > 127 ? 1 : 0;

    img = ctx.createImageData(W, H);
    buf32 = new Uint32Array(img.data.buffer);
    skelPaths = null;                 // recompute lazily when skeleton mode is used
    traceContours();
  }

  // ---- contour tracing (Moore neighbourhood walk over the mask) ----
  function traceContours() {
    contours = [];
    contStraight = [];
    const edge = new Uint8Array(W * H);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const i = y * W + x;
        if (!mask[i]) continue;
        if (x === 0 || y === 0 || x === W - 1 || y === H - 1 ||
            !mask[i - 1] || !mask[i + 1] || !mask[i - W] || !mask[i + W]) edge[i] = 1;
      }
    }
    const visited = new Uint8Array(W * H);
    const DX = [1, 1, 0, -1, -1, -1, 0, 1];
    const DY = [0, 1, 1, 1, 0, -1, -1, -1];
    for (let sy = 0; sy < H; sy++) {
      for (let sx = 0; sx < W; sx++) {
        const si = sy * W + sx;
        if (!edge[si] || visited[si]) continue;
        const pts = [];
        let x = sx, y = sy, dir = 0;
        do {
          const i = y * W + x;
          pts.push(i);
          visited[i] = 1;
          if (x > 0 && edge[i - 1]) visited[i - 1] = 1;
          if (x < W - 1 && edge[i + 1]) visited[i + 1] = 1;
          if (y > 0 && edge[i - W]) visited[i - W] = 1;
          if (y < H - 1 && edge[i + W]) visited[i + W] = 1;
          let d = (dir + 6) % 8, found = false;
          for (let k = 0; k < 8; k++) {
            const nx = x + DX[d], ny = y + DY[d];
            if (nx >= 0 && ny >= 0 && nx < W && ny < H && edge[ny * W + nx]) {
              x = nx; y = ny; dir = d; found = true; break;
            }
            d = (d + 1) % 8;
          }
          if (!found) break;
        } while (!(x === sx && y === sy) && pts.length < 200000);
        if (pts.length >= 16) contours.push(pts);
      }
    }
    // Straightness per point (used by ink mode): 1 on straights, ~0 in curves.
    const st = Math.max(4, Math.round(6 * S));
    for (const pts of contours) {
      const n = pts.length;
      const arr = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        const a = pts[(i - st + n) % n], b = pts[i], c = pts[(i + st) % n];
        const ax = a % W, ay = (a / W) | 0;
        const bx = b % W, by = (b / W) | 0;
        const cx = c % W, cy = (c / W) | 0;
        const ux = bx - ax, uy = by - ay, vx = cx - bx, vy = cy - by;
        const dot = ux * vx + uy * vy;
        const den = Math.hypot(ux, uy) * Math.hypot(vx, vy) || 1;
        const cos = dot / den;                     // 1 straight, -1 reversal
        const s01 = Math.max(0, (cos + 1) / 2);
        arr[i] = s01 * s01;
      }
      contStraight.push(arr);
    }
  }

  // ---- skeleton (Zhang-Suen thinning + path extraction), lazy ----
  function ensureSkeleton() {
    if (skelPaths) return;
    skelPaths = [];
    let x0 = W, x1 = 0, y0 = H, y1 = 0, any = false;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (mask[y * W + x]) { any = true; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    }
    if (!any) return;
    x0 = Math.max(0, x0 - 1); y0 = Math.max(0, y0 - 1);
    x1 = Math.min(W - 1, x1 + 1); y1 = Math.min(H - 1, y1 + 1);
    const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
    const sk = new Uint8Array(bw * bh);
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) sk[y * bw + x] = mask[(y + y0) * W + (x + x0)];

    const nb = (x, y) => (x >= 0 && y >= 0 && x < bw && y < bh) ? sk[y * bw + x] : 0;
    let changed = true, guard = 0;
    const toClear = [];
    while (changed && guard++ < 120) {
      changed = false;
      for (let sub = 0; sub < 2; sub++) {
        toClear.length = 0;
        for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
          if (!sk[y * bw + x]) continue;
          const P0 = nb(x, y - 1), P1 = nb(x + 1, y - 1), P2 = nb(x + 1, y), P3 = nb(x + 1, y + 1);
          const P4 = nb(x, y + 1), P5 = nb(x - 1, y + 1), P6 = nb(x - 1, y), P7 = nb(x - 1, y - 1);
          const B = P0 + P1 + P2 + P3 + P4 + P5 + P6 + P7;
          if (B < 2 || B > 6) continue;
          let A = 0;
          if (!P0 && P1) A++; if (!P1 && P2) A++; if (!P2 && P3) A++; if (!P3 && P4) A++;
          if (!P4 && P5) A++; if (!P5 && P6) A++; if (!P6 && P7) A++; if (!P7 && P0) A++;
          if (A !== 1) continue;
          if (sub === 0) { if (P0 * P2 * P4 || P2 * P4 * P6) continue; }
          else { if (P0 * P2 * P6 || P0 * P4 * P6) continue; }
          toClear.push(y * bw + x);
        }
        for (const i of toClear) sk[i] = 0;
        if (toClear.length) changed = true;
      }
    }

    const used = new Uint8Array(bw * bh);
    const D8x = [1, 1, 0, -1, -1, -1, 0, 1], D8y = [0, 1, 1, 1, 0, -1, -1, -1];
    const degree = (x, y) => {
      let c = 0;
      for (let k = 0; k < 8; k++) {
        const ax = x + D8x[k], ay = y + D8y[k];
        if (ax >= 0 && ay >= 0 && ax < bw && ay < bh && sk[ay * bw + ax]) c++;
      }
      return c;
    };
    const walk = (sx, sy) => {
      const pts = [];
      let x = sx, y = sy;
      for (;;) {
        pts.push((y + y0) * W + (x + x0));
        used[y * bw + x] = 1;
        let nx = -1, ny = -1;
        for (let k = 0; k < 8; k++) {
          const ax = x + D8x[k], ay = y + D8y[k];
          if (ax >= 0 && ay >= 0 && ax < bw && ay < bh && sk[ay * bw + ax] && !used[ay * bw + ax]) { nx = ax; ny = ay; break; }
        }
        if (nx < 0) break;
        x = nx; y = ny;
      }
      return pts;
    };
    const minLen = Math.round(8 * S);
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      const i = y * bw + x;
      if (!sk[i] || used[i] || degree(x, y) !== 1) continue;
      const pts = walk(x, y);
      if (pts.length >= minLen) skelPaths.push({ pts, closed: false });
    }
    for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
      const i = y * bw + x;
      if (!sk[i] || used[i]) continue;
      const pts = walk(x, y);
      if (pts.length >= minLen) skelPaths.push({ pts, closed: true });
    }
  }

  // ---- rendering ----

  // Index into a path: closed paths wrap, open paths ping-pong.
  function idxMap(i, n, closed) {
    if (closed) return ((i % n) + n) % n;
    const m = 2 * n - 2;
    let k = ((i % m) + m) % m;
    return k < n ? k : m - k;
  }

  // One dash along a path, displaced by the travelling wave, with a
  // thin tail and thick head so the flow direction reads.
  function drawDash(pts, n, closed, a, len, th, A, kw, ph) {
    for (let q = 0; q < len; q++) {
      const p = pts[idxMap(a + q, n, closed)];
      const px = p % W, py = (p / W) | 0;
      const dyw = A ? Math.round(A * Math.sin(px * kw - ph)) : 0;
      const tt = q < len * 0.3 ? Math.max(1, th - 1) : q > len * 0.75 ? th + 1 : th;
      for (let yy = 0; yy < tt; yy++) {
        const Y = py + dyw + yy;
        if (Y < 0 || Y >= H) continue;
        const row = Y * W;
        for (let xx = 0; xx < tt; xx++) {
          const X = px + xx;
          if (X < W) buf32[row + X] = ON;
        }
      }
    }
  }

  function render() {
    buf32.fill(OFF);
    const mode = +ui.mode.value;
    const G = scaleF();
    const t = offAcc * 1.2 * S;                    // march distance in px
    const th = Math.max(2, Math.round(1.5 * S));
    const A = +ui.wave.value * 9 * S;              // wave amplitude
    const kw = (2 * Math.PI) / (150 * S);          // wave number (λ = 150 css px)
    const ph = offAcc * 0.05;                      // wave phase

    if (mode === 3) {
      ensureSkeleton();
      if (skelPaths.length) {
        for (let ci = 0; ci < skelPaths.length; ci++) {
          const { pts, closed } = skelPaths[ci];
          const n = pts.length;
          const dir = (ci & 1) ? -1 : 1;
          const dashLen = Math.min(Math.round(16 * S * G), n - 1);
          const period = dashLen + Math.round(20 * S * G);
          const k = Math.max(1, Math.round(n / period));
          const per = n / k;
          const offp = (dir * t) % per;
          for (let j = 0; j < k; j++) {
            drawDash(pts, n, closed, Math.round(j * per + offp), dashLen, th + 1, A, kw, ph);
          }
        }
        ctx.putImageData(img, 0, 0);
        return;
      }
      // fall through to outline rendering if the skeleton came up empty
    }

    for (let ci = 0; ci < contours.length; ci++) {
      const pts = contours[ci];
      const n = pts.length;
      const dir = (ci & 1) ? -1 : 1;
      if (mode === 1) {
        // weave: two streams in opposite directions on the same outline.
        const dashLen = Math.min(Math.round(10 * S * G), n - 1);
        const period = dashLen + Math.round(30 * S * G);
        const k = Math.max(1, Math.round(n / period));
        const per = n / k;
        for (let j = 0; j < k; j++) {
          drawDash(pts, n, true, Math.round(j * per + (t % per)), dashLen, th, A, kw, ph);
          drawDash(pts, n, true, Math.round(j * per + per / 2 - (t % per)), dashLen, th, A, kw, ph);
        }
      } else if (mode === 5) {
        // ink: every contour completes a lap in the same time, and dashes
        // stretch on straights / shrink into curves.
        const baseLen = Math.min(Math.round(14 * S * G), n - 1);
        const period = baseLen + Math.round(24 * S * G);
        const k = Math.max(1, Math.round(n / period));
        const per = n / k;
        const offp = dir * ((offAcc * 0.012 * n) % per);
        const str = contStraight[ci];
        for (let j = 0; j < k; j++) {
          const a = Math.round(j * per + offp);
          const head = ((a % n) + n) % n;
          const len = Math.max(3, Math.round(baseLen * (0.45 + 1.3 * str[head])));
          drawDash(pts, n, true, a, len, th, A, kw, ph);
        }
      } else {
        // swim / pulse / reveal: one stream with a per-mode dash length rule.
        const baseLen = Math.min(Math.round(14 * S * G), n - 1);
        const period = baseLen + Math.round(24 * S * G);
        const k = Math.max(1, Math.round(n / period));
        const per = n / k;
        const offp = (dir * t) % per;
        for (let j = 0; j < k; j++) {
          const a = Math.round(j * per + offp);
          let len = baseLen;
          if (mode === 2) {
            len = Math.max(3, Math.round(baseLen * (0.55 + 0.45 * Math.sin(offAcc * 0.11 + j * 1.7 + ci))));
          } else if (mode === 4) {
            const head = pts[((a % n) + n) % n];
            const env = 0.5 + 0.5 * Math.sin((head % W) * kw - ph);
            len = Math.max(2, Math.round(baseLen * (0.2 + 2.4 * env)));
          }
          drawDash(pts, n, true, a, len, th, A, kw, ph);
        }
      }
    }
    ctx.putImageData(img, 0, 0);
  }

  // Fixed-timestep clock: simulation frames advance at the chosen fps
  // (default 24) regardless of display refresh rate.
  let last = 0;
  function tick(t) {
    raf = 0;
    if (!playing) return;
    raf = requestAnimationFrame(tick);
    const step = 1000 / +ui.fps.value;
    if (t - last < step - 0.5) return;
    last = t;
    frame++;
    offAcc += +ui.speed.value;
    render();
  }

  function setPlaying(p) {
    playing = p;
    ui.pause.textContent = p ? 'pause' : 'play';
    if (p) { last = 0; if (!raf) raf = requestAnimationFrame(tick); }
  }

  // ---- wiring ----
  let rebuildTimer = 0;
  function queueRebuild() {
    clearTimeout(rebuildTimer);
    rebuildTimer = setTimeout(() => { rebuild(); if (!playing) render(); }, 100);
  }

  ui.text.addEventListener('input', queueRebuild);
  ui.size.addEventListener('input', () => { ui.sizeVal.textContent = ui.size.value; queueRebuild(); });
  ui.speed.addEventListener('input', () => { ui.speedVal.textContent = ui.speed.value; });
  ui.wave.addEventListener('input', () => { ui.waveVal.textContent = ui.wave.value; if (!playing) render(); });
  ui.grain.addEventListener('change', () => { if (!playing) render(); });
  ui.mode.addEventListener('change', () => { if (!playing) render(); });
  ui.pause.addEventListener('click', () => setPlaying(!playing));
  canvas.addEventListener('pointerdown', () => setPlaying(!playing));
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
  });
  window.addEventListener('resize', queueRebuild);

  rebuild();
  setPlaying(true);

  // Live reload: poll Last-Modified when served over http (not file://).
  if (location.protocol.startsWith('http')) {
    let stamp = null;
    setInterval(async () => {
      try {
        const res = await fetch(location.href, { method: 'HEAD', cache: 'no-store' });
        const t = res.headers.get('Last-Modified');
        if (stamp && t && t !== stamp) location.reload();
        if (t) stamp = t;
      } catch {}
    }, 1000);
  }
})();
</script>
</body>
</html>
