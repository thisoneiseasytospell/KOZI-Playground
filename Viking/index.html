<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viking FK</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  body { font: 12px/1.4 -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #c8c8c8; }
  canvas#c { display: block; width: 100%; height: 100%; }

  /* Soft vignette over the black void */
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 70% 65% at 50% 48%, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }

  /* ── Dock ── centred at the bottom, one row, square everything */
  #ui {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    user-select: none; -webkit-user-select: none;
  }
  #ui.hidden { display: none; }
  .dock {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 10px; max-width: calc(100vw - 24px);
    background: rgba(12,12,12,0.82); border: 1px solid rgba(255,255,255,0.10);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .grp { display: flex; align-items: center; gap: 6px; }
  .sep { width: 1px; height: 18px; background: rgba(255,255,255,0.10); }
  .lbl { color: #7a7a7a; letter-spacing: 0.02em; }
  .val { width: 22px; text-align: right; color: #7a7a7a; font-variant-numeric: tabular-nums; }

  .swatch {
    width: 20px; height: 20px; cursor: pointer; padding: 0;
    border: 1px solid rgba(255,255,255,0.14); box-sizing: border-box; outline: none;
  }
  .swatch.active { border-color: #fff; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 84px; height: 3px; background: rgba(255,255,255,0.16); outline: none; margin: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 7px; height: 16px; background: #DBC067; border: 0; cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 7px; height: 16px; background: #DBC067; border: 0; border-radius: 0; cursor: pointer;
  }

  .pill {
    padding: 3px 9px; cursor: pointer; font: inherit; line-height: 1.3; color: #9a9a9a;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
  }
  .pill.active { color: #111; background: #DBC067; border-color: #DBC067; }

  /* Gust: press and hold — the fill is the charge */
  #gust {
    position: relative; width: 78px; height: 20px; padding: 0; cursor: pointer;
    font: inherit; color: #c0c0c0; text-align: center;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
    overflow: hidden;
  }
  #gustFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: #DBC067; opacity: 0.55;
  }
  #gustLbl { position: relative; }

  #text {
    width: 108px; height: 20px; padding: 0 5px; box-sizing: border-box;
    font: inherit; text-transform: uppercase; letter-spacing: 0.04em; color: #d8d8d8;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); outline: none;
  }
  #text:focus { border-color: rgba(219,192,103,0.55); }
  #text::placeholder { color: #5c5c5c; letter-spacing: 0.04em; }

  .toggle { display: flex; align-items: center; gap: 6px; color: #7a7a7a; cursor: pointer; }
  .toggle input {
    -webkit-appearance: none; appearance: none; margin: 0;
    width: 12px; height: 12px; background: transparent;
    border: 1px solid rgba(255,255,255,0.28); cursor: pointer;
  }
  .toggle input:checked { background: #DBC067; border-color: #DBC067; }

  .hint { color: #565656; font-size: 10px; letter-spacing: 0.02em; }
  kbd { color: #8a8a8a; font: inherit; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>
</head>
<body>

<canvas id="c"></canvas>
<div class="vignette"></div>

<div id="ui">
  <div class="dock">
    <div class="grp" id="swatches"></div>
    <span class="sep"></span>
    <div class="grp">
      <span class="lbl">Wind</span>
      <input type="range" id="wind" min="0" max="100" value="70">
      <span class="val" id="windVal">70</span>
    </div>
    <span class="sep"></span>
    <div class="grp">
      <span class="lbl">Text</span>
      <input type="text" id="text" maxlength="20" placeholder="STAVANGER" spellcheck="false" autocomplete="off">
    </div>
    <span class="sep"></span>
    <div class="grp" id="modes"></div>
    <span class="sep"></span>
    <button id="gust" title="Hold to build a bigger gust"><span id="gustFill"></span><span id="gustLbl">Gust</span></button>
    <span class="sep"></span>
    <label class="toggle"><input type="checkbox" id="cycle" checked> Cycle</label>
  </div>
  <div class="hint"><kbd>Space</kbd> hold to build a gust · <kbd>1–4</kbd> design · <kbd>M</kbd>/<kbd>W</kbd> mast/wave · <kbd>H</kbd> hide</div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
