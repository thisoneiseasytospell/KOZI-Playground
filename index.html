<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOZI Playground</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-119K8L8N8H"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-119K8L8N8H');
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'ABCDiatype', monospace;
      background-color: #000;
      color: #fff;
      padding: 40px;
      font-size: 0.75em;
    }
    .container {
      max-width: 100%;
    }
    h1 {
      margin-bottom: 40px;
      font-size: 1em;
      font-weight: normal;
      letter-spacing: 2px;
    }
    .project-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .project-card {
      padding: 8px 0;
      text-decoration: none;
      color: #fff;
      cursor: pointer;
      background-color: #000;
      border: none;
      border-radius: 0;
      display: inline-block;
      width: fit-content;
      position: relative;
    }
    .project-card:hover h2 {
      text-decoration: underline;
    }
    .project-card h2 {
      font-size: 1em;
      font-weight: normal;
      display: inline-flex;
      align-items: center;
      gap: 0.28em;
    }
    .project-card h2::after {
      content: "";
      width: 0.95em;
      height: 0.95em;
      display: inline-block;
      background: url("assets/arrow.svg") no-repeat center / contain;
      line-height: 1;
      transform: translateY(-0.01em);
    }
    .video-preview {
      display: none;
      position: fixed;
      max-width: 400px;
      max-height: 300px;
      z-index: 1000;
      pointer-events: none;
      cursor: pointer;
    }
    .project-card:hover .video-preview {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1><a href="https://kozi.studio/" style="color:#fff;text-decoration:none;">KOZI</a> Playground</h1>
    <div class="project-list">
      <a href="ASCII/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>ASCII Camera Glitch</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/asciidemo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="GLGS/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>GLGS</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/gsgs%20demo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="Grafitti/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>Grafitti</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/grafittidemo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="Thunderbolt/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>Thunderbolt</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/thunderdemo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="010%20Totems/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>010 Totems</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/010demo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="T%23/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>T#</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/T%23demo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="KZI%20SPRING/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>SPRNG NYC</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/KZIspringdemo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="Flag/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>Flag</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="demos/flagdemo.mp4" type="video/mp4">
        </video>
      </a>
      <a href="WdKA%20Grad/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>WdKA Grad</h2>
        <video class="video-preview" autoplay loop muted playsinline>
          <source src="WdKA%20Grad/Wdka%20Grad%20Final%204.mp4" type="video/mp4">
        </video>
      </a>
      <a href="Enode/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>Enode</h2>
      </a>
      <a href="Carte%20Blenche/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>Carte Blenche</h2>
      </a>
      <a href="Ant%20Text/index.html" class="project-card" target="_blank" rel="noopener noreferrer">
        <h2>Ant Text</h2>
      </a>
    </div>
  </div>
  <script>
    document.querySelectorAll('.project-card').forEach(card => {
      const video = card.querySelector('.video-preview');
      card.addEventListener('mousemove', (e) => {
        if (!video) return;
        video.style.left = (e.clientX + 20) + 'px';
        video.style.top = (e.clientY + 20) + 'px';
      });
    });
  </script>
</body>
</html>
