    @media (hover: none), (max-width: 700px) {

        max-height: none;

  <script>
    (function () {
      var inlineMedia = window.matchMedia('(hover: none), (max-width: 700px)');
      var previews = [];
      var observer = null;

      function start(video) {
        var attempt = video.play();
        if (attempt && typeof attempt.catch === 'function') {
          attempt.catch(function () {});
        }
      }

      document.querySelectorAll('.project-card').forEach(function (card) {
        var video = card.querySelector('.video-preview');
        if (!video) return;
        previews.push(video);

        card.addEventListener('mousemove', function (e) {
          if (inlineMedia.matches) return;
          video.style.left = (e.clientX + 20) + 'px';
          video.style.top = (e.clientY + 20) + 'px';
        });

        // preload="none" keeps the list cheap, so hovering is what actually
        // fetches the clip.
        card.addEventListener('pointerenter', function () {
          if (inlineMedia.matches) return;
          start(video);
        });

        card.addEventListener('pointerleave', function () {
          if (inlineMedia.matches) return;
          video.pause();
        });
      });

      // Inline previews would pull every clip at once, so each one only
      // loads as it scrolls into view.
      function enableInline() {
        if (observer) return;

        if (!('IntersectionObserver' in window)) {
          previews.forEach(start);
          return;
        }

        observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) start(entry.target);
            else entry.target.pause();
          });
        }, { rootMargin: '15% 0px', threshold: 0.2 });

        previews.forEach(function (video) { observer.observe(video); });
      }

      function disableInline() {
        if (!observer) return;
        observer.disconnect();
        observer = null;
        previews.forEach(function (video) { video.pause(); });
      }

      function sync() {
        if (inlineMedia.matches) enableInline();
        else disableInline();
      }

      function inView(video) {
        var rect = video.getBoundingClientRect();
        return rect.bottom > 0 && rect.top < window.innerHeight;
      }

      // Low Power Mode rejects autoplay outright; the first interaction
      // starts whatever should already be running.
      function retryBlockedPlayback() {
        if (!inlineMedia.matches) return;
        previews.forEach(function (video) {
          if (video.paused && inView(video)) start(video);
        });
      }

      ['pointerdown', 'touchstart', 'keydown'].forEach(function (type) {
        window.addEventListener(type, retryBlockedPlayback, { capture: true, passive: true });
      });

      // Returning to a backgrounded tab leaves the previews paused with no
      // intersection change left to restart them.
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') retryBlockedPlayback();
      });

      sync();

      if (typeof inlineMedia.addEventListener === 'function') {
        inlineMedia.addEventListener('change', sync);
      } else if (typeof inlineMedia.addListener === 'function') {
        inlineMedia.addListener(sync);
      }
    })();
  </script>
